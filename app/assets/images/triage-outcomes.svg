<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="triage-outcomes-title triage-outcomes-desc">
  <title id="triage-outcomes-title">Example triage outcome categories</title>
  <desc id="triage-outcomes-desc">Four triage outcome categories with indicative response times: Emergency, immediate 999 response; Urgent, same day; Routine, within 5 working days; and Self-care, no appointment needed.</desc>
  <rect width="640" height="320" fill="#f0f4f5"/>
  <text x="24" y="40" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#212b32">Example triage outcome categories</text>

  <!-- Emergency -->
  <g>
    <rect x="24" y="64" width="284" height="96" rx="8" fill="#ffffff" stroke="#aeb7bd"/>
    <rect x="24" y="64" width="8" height="96" rx="4" fill="#d5281b"/>
    <text x="48" y="102" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#d5281b">Emergency</text>
    <text x="48" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4c6272">Immediate response (999)</text>
  </g>

  <!-- Urgent -->
  <g>
    <rect x="332" y="64" width="284" height="96" rx="8" fill="#ffffff" stroke="#aeb7bd"/>
    <rect x="332" y="64" width="8" height="96" rx="4" fill="#ed8b00"/>
    <text x="356" y="102" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#212b32">Urgent</text>
    <text x="356" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4c6272">Same day</text>
  </g>

  <!-- Routine -->
  <g>
    <rect x="24" y="184" width="284" height="96" rx="8" fill="#ffffff" stroke="#aeb7bd"/>
    <rect x="24" y="184" width="8" height="96" rx="4" fill="#005eb8"/>
    <text x="48" y="222" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#005eb8">Routine</text>
    <text x="48" y="248" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4c6272">Within 5 working days</text>
  </g>

  <!-- Self-care -->
  <g>
    <rect x="332" y="184" width="284" height="96" rx="8" fill="#ffffff" stroke="#aeb7bd"/>
    <rect x="332" y="184" width="8" height="96" rx="4" fill="#007f3b"/>
    <text x="356" y="222" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#007f3b">Self-care</text>
    <text x="356" y="248" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4c6272">No appointment needed</text>
  </g>
</svg>
